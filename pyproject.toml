[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dc_locator"
version = "0.1.0"
description = "U.S. Sustainable Data Center Location Discovery Model: a deterministic geospatial decision-support system that identifies regions in CONUS deserving further investigation for sustainable AI data-center development."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "dc_locator project" }]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Private :: Do Not Upload",
]

# Compatible ranges, not exact pins. Exact resolved versions for the real
# environment are frozen separately into requirements.lock.txt (see
# docs/environment.md for how to regenerate it). Upper bounds sit at the next
# major version to avoid an untested breaking release installing silently.
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<21",
  "shapely>=2.0,<3",
  "geopandas>=1.0,<2",
  "pyproj>=3.6,<4",
  "pyogrio>=0.9,<1",
  "rasterio>=1.3,<2",
  "scipy>=1.13,<2",
  "pyyaml>=6.0,<7",
  "pydantic>=2.6,<3",
  "requests>=2.31,<3",
  "xarray>=2024.3,<2027",
  "h5netcdf>=1.3,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "hypothesis>=6.100,<7",
]

[project.scripts]
dc-locator = "dc_locator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dc_locator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_data: needs downloaded real data (not run by default on a clean checkout)",
  "network: needs internet access",
  "slow: slow-running test",
]
